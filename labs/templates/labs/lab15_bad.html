<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 15 - Posts</title>
</head>
<body>
   <h1>Latest posts</h1> 
   <ul>
    {% for post in posts %}
    <li>
        <strong>{{post.title}}</strong> by {{post.author.name}}
        - {{ post.comments.count }} comments, {{ post.likes.count }} likes
        <p>{{ post.body | truncatewords:30 }}</p>
    </li>
    {% endfor %}
   </ul>
</body>
</html>

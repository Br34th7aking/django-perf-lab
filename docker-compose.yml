services:
  web:
    build: .
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_DB=perflab
      - POSTGRES_USER=perflab
      - POSTGRES_PASSWORD=perflab
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
  
  db:
    image: postgres:17-alpine
    environment:
      - POSTGRES_DB=perflab
      - POSTGRES_USER=perflab
      - POSTGRES_PASSWORD=perflab
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U perflab -d perflab"]
      interval: 5s
      timeout: 3s
      retries: 10
    
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  
volumes:
  pgdata:


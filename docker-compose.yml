services:
  web:
    build:
      context: .
      target: dev
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_DB=perflab
      - POSTGRES_USER=perflab
      - POSTGRES_PASSWORD=perflab
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
  
  db:
    image: postgres:17-alpine
    environment:
      - POSTGRES_DB=perflab
      - POSTGRES_USER=perflab
      - POSTGRES_PASSWORD=perflab
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U perflab -d perflab"]
      interval: 5s
      timeout: 3s
      retries: 10
  
  db_replica:
    image: postgres:17-alpine
    user: postgres
    environment:
      - PGPASSWORD=replicate
    volumes:
      - pgreplica:/var/lib/postgresql/data
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "
      if [ ! -s /var/lib/postgresql/data/PG_VERSION ]; then
        pg_basebackup -h db -U replicator -D /var/lib/postgresql/data -X stream -R;
      fi;
      chmod 0700 /var/lib/postgresql/data;
      exec postgres -c hot_standby=on -c recovery_min_apply_delay=2s"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U perflab -d perflab"]
      interval: 5s
      timeout: 3s
      retries: 10

     
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  
volumes:
  pgdata:
  pgreplica:

